services:
  - type: web
    name: langchain-rag-api
    runtime: docker
    plan: standard
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: API_DOCS
        value: "false"
      - key: LANGSMITH_TRACING
        value: "false"
      - key: API_KEYS
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
